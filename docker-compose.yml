services:
  postgres:
    image: postgres:16-alpine
    container_name: learnext-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-learnext}
      POSTGRES_USER: ${POSTGRES_USER:-learnext}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learnext}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - learnext-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learnext} -d ${POSTGRES_DB:-learnext}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: learnext-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - learnext-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: learnext-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - learnext-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: learnext-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin};
      mc mb -p local/${MINIO_BUCKET:-learnext};
      mc anonymous set download local/${MINIO_BUCKET:-learnext};
      "

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: learnext-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"

volumes:
  learnext-postgres-data:
  learnext-redis-data:
  learnext-minio-data:
