server:
  port: 1201

spring:
  application:
    name: learnext

  datasource:
    url: jdbc:postgresql://localhost:5432/learnext?TimeZone=Asia/Ho_Chi_Minh
    username: learnext
    password: learnext

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      username: learnext
      password: learnext123
      timeout: 3s
      repositories:
        enabled: false

  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10 phút

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

minio:
  endpoint: http://localhost:9000
  access-key: learnext
  secret-key: learnext123
  bucket: learnext
  region: us-east-1
  timeout: 3s
