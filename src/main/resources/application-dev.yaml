server:
  port: 1201

spring:
  application:
    name: learnext

  datasource:
    url: jdbc:postgresql://100.64.0.5:5432/learnext
    username: learnext
    password: learnext

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: 100.64.0.7
      port: 6379
      username: learnext
      password: learnext
      timeout: 3s
      repositories:
        enabled: false

  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10 phút

jwt:
  # Tối thiểu 256-bit (32 ký tự) cho HS256
  secret: a8f9d2k3l4m5n6p7q8r9s0t1u2v3w4x5
  access-token-expiry: 900      # 15 phút (seconds)
  refresh-token-expiry: 604800  # 7 ngày (seconds)

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true


minio:
  endpoint: http://100.64.0.8:9000
  access-key: learnext
  secret-key: learnext123
  bucket: learnext
  region: us-east-1
  timeout: 3s
