server:
  port: ${SERVER_PORT:1201}

spring:
  application:
    name: learnext

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/learnext}
    username: ${DB_USERNAME:learnext}
    password: ${DB_PASSWORD:learnext}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}

  cache:
    type: redis
    redis:
      time-to-live: 600000

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

jwt:
  secret: ${JWT_SECRET:a8f9d2k3l4m5n6p7q8r9s0t1u2v3w4x5}
  access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY:900}
  refresh-token-expiry: ${JWT_REFRESH_TOKEN_EXPIRY:604800}

storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:learnext}
    public-base-url: ${MINIO_PUBLIC_BASE_URL:http://localhost:9000/learnext}

admin:
  key: ${ADMIN_KEY:dev-admin-key}
  email: ${ADMIN_EMAIL:admin@learnext.local}
  password: ${ADMIN_PASSWORD:admin123}

payment:
  vietqr:
    bank-bin: ${PAYMENT_VIETQR_BANK_BIN:970423}
    account-number: ${PAYMENT_VIETQR_ACCOUNT_NUMBER:10000232922}
    account-name: ${PAYMENT_VIETQR_ACCOUNT_NAME:LEARNEXT}

app:
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

mail:
  from: ${MAIL_FROM:no-reply@learnext.local}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
